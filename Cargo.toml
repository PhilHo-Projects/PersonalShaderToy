[package]
name = "personal-shadertoy"
version = "0.1.0"
edition = "2024"
default-run = "personal-shadertoy"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
png = "0.17"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { version = "29.0", features = ["static-dxc"] }
winit = { version = "0.30.12", features = ["rwh_06"] }
egui = "0.34.1"
egui-wgpu = "0.34.1"
egui-winit = "0.34.1"
env_logger = "0.11"
notify = "8.2.0"

shader-core = { path = "shader-core" }
rfd = "0.15"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

tempfile = "3"

[build-dependencies]
serde_json = "1"

[workspace]
members = ["shader-core"]
resolver = "3"
