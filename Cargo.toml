[package]
name = "personal-shadertoy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
png = "0.17"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { version = "29.0", features = ["static-dxc"] }
winit = { version = "0.30.12", features = ["rwh_06"] }
egui = "0.34.1"
egui-wgpu = "0.34.1"
egui-winit = "0.34.1"
naga = { version = "29.0.1", features = ["glsl-in", "wgsl-out"] }
env_logger = "0.11"
log = "0.4"
regex = "1.12.3"
notify = "8.2.0"
