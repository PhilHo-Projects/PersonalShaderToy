[package]
name = "shader-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
naga = { version = "=29.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out", "spv-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
spirv-cross2 = { version = "=0.7.2", default-features = false, features = ["hlsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
